{% extends "pedido/base.html" %}

{% block body %}
<h3 class="text-center m-4">Update Pedido
    {% if success %}
    <div class="alert alert-success" role="alert">
        The Pedido update successfully.
        <a href="{% url 'index' %}" class="alert-link"> Go the Home Page Bible.</a>
    </div>
    {% else %}
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="card bg-light mb-3">
                <div class="card-header">
                    <i class="fa-solid fa-pen-to-square fa-lg"></i>Update Pedido Record
                </div>
                <div class="card-body">
                    <h4 class="card-title">Light card title</h4>
                    <form action="" method="POST"> 
                        {% csrf_token %}
                        {{form.as_p}}
                        <button type="submit" class="btn btn-primary">Update</button>
                        <a href="{% url 'index' %}" class="btn btn-secondary">Cancel</a>
                            
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</h3>
{% endblock %}
